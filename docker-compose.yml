version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: yolo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yolo_userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yolo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: yolo_web
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: yolo_userdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: gucluJwtSecretKey123456
      ADMIN_EMAIL: admin@yolo.com
      ADMIN_PASSWORD: Admin123!
    volumes:
      - .:/app
    networks:
      - yolo_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  yolo_network: