<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Admin Panel - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 50px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            color: #00d26a;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus {
            border-color: #00d26a;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 20px rgba(0,210,106,0.1);
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-group .input-icon {
            position: absolute;
            right: 16px;
            top: 45px;
            color: rgba(255,255,255,0.3);
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d26a, #00a84d);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,210,106,0.3);
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .login-error {
            background: rgba(255,0,0,0.15);
            border: 1px solid rgba(255,0,0,0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
        }
        .loading-dots {
            display: none;
        }
        .form-group input.error {
            border-color: #ff6b6b !important;
        }
        /* Floating shapes animation */
        .shape {
            position: fixed;
            border-radius: 50%;
            opacity: 0.05;
            pointer-events: none;
        }
        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #00d26a;
            top: -150px;
            right: -150px;
            animation: float 20s infinite;
        }
        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #6c63ff;
            bottom: -100px;
            left: -100px;
            animation: float 25s infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(50px, -50px) rotate(120deg); }
            66% { transform: translate(-30px, 30px) rotate(240deg); }
        }
    </style>
</head>
<body>
    <div class="shape"></div>
    <div class="shape"></div>

    <div class="login-container">
        <div class="login-header">
            <h1>🔐 YOLO Admin</h1>
            <p>Yönetim paneline giriş yapın</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" placeholder="admin@yolo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="loginText">Giriş Yap</span>
                <span class="loading-dots" id="loadingDots">⏳</span>
            </button>

            <div class="login-error" id="loginError">
                ⚠️ Geçersiz email veya şifre!
            </div>
        </form>

        <div class="login-footer">
            YOLO Analiz Sistemi v2.0 • Güvenli Giriş
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loadingDots = document.getElementById('loadingDots');
        const loginError = document.getElementById('loginError');

        // Geliştirici araçlarını engelleme
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
                loginError.style.display = 'block';
                loginError.textContent = '🔒 Geliştirici araçları devre dışı!';
                setTimeout(() => {
                    loginError.style.display = 'none';
                }, 3000);
                return false;
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Form validasyonu
            if (!email.value || !password.value) {
                loginError.textContent = '⚠️ Lütfen tüm alanları doldurun!';
                loginError.style.display = 'block';
                setTimeout(() => { loginError.style.display = 'none'; }, 3000);
                return;
            }

            // Buton durumu
            loginBtn.disabled = true;
            loginText.textContent = 'Giriş Yapılıyor...';
            loadingDots.style.display = 'inline';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email.value,
                        password: password.value
                    }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Başarılı giriş
                    loginText.textContent = '✅ Yönlendiriliyor...';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    // Hata
                    loginError.textContent = data.error || '⚠️ Giriş başarısız!';
                    loginError.style.display = 'block';
                    email.classList.add('error');
                    password.classList.add('error');
                    setTimeout(() => {
                        loginError.style.display = 'none';
                        email.classList.remove('error');
                        password.classList.remove('error');
                    }, 3000);
                }
            } catch (error) {
                loginError.textContent = '⚠️ Sunucu bağlantı hatası!';
                loginError.style.display = 'block';
                setTimeout(() => { loginError.style.display = 'none'; }, 3000);
            } finally {
                loginBtn.disabled = false;
                loginText.textContent = 'Giriş Yap';
                loadingDots.style.display = 'none';
            }
        });

        // Otomatik odak
        email.focus();
    </script>
</body>
</html>
