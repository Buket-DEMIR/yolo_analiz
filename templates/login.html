<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 35px;
            width: 100%;
            max-width: 400px;
            transform: scale(0.9);
            animation: fadeIn 0.4s forwards ease-in-out;
        }
        @keyframes fadeIn { 
            to { transform: scale(1); } 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4 text-dark font-weight-bold">Yönetim Paneli</h3>
        
        <!-- Hata veya Bilgi Mesajları -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-center py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small">E-Posta Adresi</label>
                <input type="email" name="email" class="form-control shadow-sm" required autocomplete="off">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">Şifre</label>
                <input type="password" name="password" class="form-control shadow-sm" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm fw-bold">Güvenli Giriş Yap</button>
        </form>
    </div>
</body>
</html>
