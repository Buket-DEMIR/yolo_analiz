<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Admin - Yönetim Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            padding: 30px 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar h2 {
            color: #00d26a;
            font-size: 22px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .user-info {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        .sidebar .user-info strong {
            color: #fff;
            display: block;
            font-size: 16px;
        }
        .sidebar .menu-item {
            padding: 12px 16px;
            margin: 5px 0;
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .menu-item:hover {
            background: rgba(0,210,106,0.1);
            color: #fff;
        }
        .sidebar .menu-item.active {
            background: rgba(0,210,106,0.15);
            color: #00d26a;
        }
        .sidebar .menu-item.logout {
            margin-top: 50px;
            color: #ff6b6b;
        }
        .sidebar .menu-item.logout:hover {
            background: rgba(255,0,0,0.1);
        }
        .main-content {
            margin-left: 250px;
            padding: 30px 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 300;
        }
        .header h1 span {
            color: #00d26a;
            font-weight: 600;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0,210,106,0.3);
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: #00d26a;
        }
        .stat-card .label {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 5px;
        }
        .table-container {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .table-container h3 {
            margin-bottom: 20px;
            color: rgba(255,255,255,0.8);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th {
            text-align: left;
            padding: 12px 15px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #00d26a;
            color: #fff;
        }
        .btn-primary:hover {
            background: #00b85a;
            transform: scale(1.02);
        }
        .btn-danger {
            background: rgba(255,0,0,0.2);
            color: #ff6b6b;
        }
        .btn-danger:hover {
            background: rgba(255,0,0,0.3);
        }
        .btn-warning {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
        }
        .btn-warning:hover {
            background: rgba(255,165,0,0.3);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: #fff;
        }
        .modal-content input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #00d26a;
        }
        .modal-content .btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-size: 15px;
        }
        .modal-close {
            float: right;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            font-size: 24px;
        }
        .modal-close:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🚀 YOLO Admin</h2>
        <div class="user-info">
            <strong id="userEmail">admin@yolo.com</strong>
            <span style="font-size:12px;color:#00d26a;">👑 Yönetici</span>
        </div>
        <div class="menu-item active">📊 Dashboard</div>
        <div class="menu-item" onclick="showAddUser()">➕ Kullanıcı Ekle</div>
        <div class="menu-item logout" onclick="logout()">🚪 Çıkış Yap</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Hoş Geldiniz, <span id="userName">Admin</span> 👋</h1>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Toplam Kullanıcı</div>
            </div>
            <div class="stat-card">
                <div class="number" id="adminUsers">0</div>
                <div class="label">Admin Kullanıcı</div>
            </div>
            <div class="stat-card">
                <div class="number" id="activeUsers">0</div>
                <div class="label">Aktif Kullanıcı</div>
            </div>
        </div>

        <div class="table-container">
            <h3>👥 Kullanıcı Listesi</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Telefon</th>
                        <th>Rol</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center;color:rgba(255,255,255,0.3);">
                            Kullanıcılar yükleniyor...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Kullanıcı Ekle -->
    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('addUserModal')">&times;</span>
            <h2>➕ Yeni Kullanıcı Ekle</h2>
            <input type="email" id="newEmail" placeholder="E-posta adresi">
            <input type="password" id="newPassword" placeholder="Şifre">
            <input type="text" id="newPhone" placeholder="Telefon numarası">
            <button class="btn btn-primary" onclick="addUser()">Kullanıcı Ekle</button>
        </div>
    </div>

    <!-- Modal: Şifre Güncelle -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('passwordModal')">&times;</span>
            <h2>🔑 Şifre Güncelle</h2>
            <input type="password" id="newPasswordInput" placeholder="Yeni şifre">
            <input type="password" id="confirmPassword" placeholder="Şifreyi tekrarla">
            <button class="btn btn-primary" onclick="updatePassword()">Şifreyi Güncelle</button>
        </div>
    </div>

    <script>
        let currentUserId = null;

        // Kullanıcıları listele
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    const users = data.users || [];
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';
                    
                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.email}</td>
                            <td>${user.phone || '-'}</td>
                            <td>${user.is_admin ? '👑 Admin' : '👤 Kullanıcı'}</td>
                            <td>
                                <button class="btn btn-warning" onclick="showPasswordModal(${user.id})">🔑</button>
                                <button class="btn btn-danger" onclick="deleteUser(${user.id})">🗑️</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // İstatistikleri güncelle
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('adminUsers').textContent = users.filter(u => u.is_admin).length;
                    document.getElementById('activeUsers').textContent = users.length;
                }
            } catch (error) {
                console.error('Kullanıcılar yüklenirken hata:', error);
            }
        }

        // Kullanıcı ekle
        async function addUser() {
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newPassword').value;
            const phone = document.getElementById('newPhone').value;

            if (!email || !password) {
                alert('Email ve şifre gereklidir!');
                return;
            }

            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, phone })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('✅ Kullanıcı başarıyla eklendi!');
                    closeModal('addUserModal');
                    loadUsers();
                } else {
                    alert('❌ Hata: ' + data.error);
                }
            } catch (error) {
                alert('❌ Bağlantı hatası!');
            }
        }

        // Kullanıcı sil
        async function deleteUser(userId) {
            if (!confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    alert('✅ Kullanıcı silindi!');
                    loadUsers();
                } else {
                    alert('❌ Kullanıcı silinemedi!');
                }
            } catch (error) {
                alert('❌ Bağlantı hatası!');
            }
        }

        // Şifre güncelleme modal'ı
        function showPasswordModal(userId) {
            currentUserId = userId;
            document.getElementById('passwordModal').classList.add('active');
        }

        // Şifre güncelle
        async function updatePassword() {
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || newPassword !== confirmPassword) {
                alert('Şifreler eşleşmiyor!');
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${currentUserId}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ new_password: newPassword })
                });

                if (response.ok) {
                    alert('✅ Şifre başarıyla güncellendi!');
                    closeModal('passwordModal');
                } else {
                    alert('❌ Şifre güncellenemedi!');
                }
            } catch (error) {
                alert('❌ Bağlantı hatası!');
            }
        }

        // Modal aç/kapat
        function showAddUser() {
            document.getElementById('addUserModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // Çıkış yap
        async function logout() {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = '/api/auth/login-page';
            } catch (error) {
                window.location.href = '/api/auth/login-page';
            }
        }

        // Sayfa yüklendiğinde kullanıcıları getir
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
